<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi PWA Single File</title>
  
  <!-- Meta Tag PWA & Tema -->
  <meta name="theme-color" content="#4A90E2">
  <meta name="description" content="Aplikasi PWA Single File Sederhana">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/4A90E2/ffffff?text=PWA">

  <!-- Manifest PWA Dinamis via Data URI -->
  <script>
    const manifest = {
      "name": "PWA Single File",
      "short_name": "PWA App",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#4A90E2",
      "icons": [
        {
          "src": "https://via.placeholder.com/192/4A90E2/ffffff?text=PWA",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://via.placeholder.com/512/4A90E2/ffffff?text=PWA",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    /* CSS Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .online { background-color: #e6f4ea; color: #137333; }
    .offline { background-color: #fce8e6; color: #c5221f; }

    .btn {
      background-color: #4A90E2;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #357abd;
    }

    #installBtn {
      display: none;
      background-color: #34a853;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>PWA Single File</h1>
    <p>Aplikasi ini dapat diinstal dan berjalan secara offline!</p>
    
    <div id="status" class="status online">Online</div>

    <button class="btn" onclick="tambahHitungan()">Klik Saya (<span id="counter">0</span>)</button>
    <button id="installBtn" class="btn">Install Aplikasi</button>
  </div>

  <script>
    // --- 1. Logika Aplikasi Sederhana ---
    let count = parseInt(localStorage.getItem('counter') || '0');
    document.getElementById('counter').innerText = count;

    function tambahHitungan() {
      count++;
      document.getElementById('counter').innerText = count;
      localStorage.setItem('counter', count);
    }

    // --- 2. Deteksi Status Online / Offline ---
    function updateStatus() {
      const statusEl = document.getElementById('status');
      if (navigator.onLine) {
        statusEl.innerText = "Online";
        statusEl.className = "status online";
      } else {
        statusEl.innerText = "Offline";
        statusEl.className = "status offline";
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();

    // --- 3. Prompt Install PWA ---
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      }
    });

    // --- 4. Registrasi Service Worker dari Blob ---
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'pwa-single-file-v1';

        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });

        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });

        self.addEventListener('fetch', (e) => {
          e.respondWith(
            fetch(e.request).catch(() => {
              return caches.match(e.request);
            })
          );
        });
      `;

      const blob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl)
        .then(() => console.log('Service Worker berhasil didaftarkan!'))
        .catch(err => console.error('Gagal mendaftarkan Service Worker:', err));
    }
  </script>
</body>
</html>
